[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "acacium-board-paper-prototype"
version = "0.1.0"
description = "Evidence-first board paper intelligence prototype"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.141,<0.142",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.19,<7",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.35,<0.36",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.17,<1.18",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.3,<5",
  "pytest>=9.1,<9.2",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<0.13",
  "vulture>=2.14,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/acacium"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers --cov=acacium --cov-report=term-missing"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["backend/src"]
